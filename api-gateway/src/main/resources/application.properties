spring.application.name=api-gateway
server.port=8080

# Eureka 
eureka.client.service-url.defaultZone=http://${EUREKA_SERVER:localhost}:8761/eureka/
eureka.instance.hostname=${spring.application.name}

# Discovery locator 
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# Routes 
spring.cloud.gateway.server.webflux.routes[0].id=vehicle-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://vehicle-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/vehicles/**

spring.cloud.gateway.server.webflux.routes[1].id=rate-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://rate-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/rates/**

spring.cloud.gateway.server.webflux.routes[2].id=ticket-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://ticket-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/tickets/**

spring.cloud.gateway.server.webflux.routes[3].id=security-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://security-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/auth/**
