spring.application.name=ticket-service
server.port=8084

# Eureka
eureka.client.service-url.defaultZone=http://${EUREKA_SERVER:localhost}:8761/eureka/
eureka.instance.hostname=${spring.application.name}
# MySQL
# spring.datasource.url=jdbc:mysql://localhost:3307/ticketdb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
#spring.datasource.username=root
#spring.datasource.password=root

#spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

#MongoDB
spring.data.mongodb.uri=mongodb://${MONGO_USER:admin}:${MONGO_PASSWORD:admin123}@localhost:27017/ticketdb?authSource=admin
spring.data.mongodb.database=ticket-service

spring.data.mongodb.auto-index-creation=true

# Expose health, info and prometheus endpoints
management.endpoints.web.exposure.include=health,info,prometheus

# show detailed health info
management.endpoint.health.show-details=always