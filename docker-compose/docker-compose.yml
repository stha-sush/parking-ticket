services:
  eureka-server:
    build:
      context: ../eureka-server
      dockerfile: Dockerfile
    image: parking-eureka-server
    container_name: parking-eureka-server
    ports:
      - "8761:8761"
    networks:
      - ms-network

  vehicle-service:
    build:
      context: ../vehicle-service
      dockerfile: Dockerfile
    image: parking-vehicle-service
    container_name: parking-vehicle-service
    depends_on:
      - eureka-server
      - mosquitto
    ports:
      - "8082:8082"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATA_MONGODB_URI=mongodb://admin:admin123@mongodb:27017
      - SPRING_DATA_MONGODB_DATABASE=vehicle-service
      - MQTT_HOST=mosquitto
    networks:
      - ms-network

  rate-service:
    build:
      context: ../rate-service
      dockerfile: Dockerfile
    image: parking-rate-service
    container_name: parking-rate-service
    depends_on:
      - eureka-server
    ports:
      - "8083:8083"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysqldb:3306/ratedb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    networks:
      - ms-network

  ticket-service:
    build:
      context: ../ticket-service
      dockerfile: Dockerfile
    image: parking-ticket-service
    container_name: parking-ticket-service
    depends_on:
      - eureka-server
    ports:
      - "8084:8084"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATA_MONGODB_URI=mongodb://admin:admin123@mongodb:27017/ticketdb?authSource=admin
      - SPRING_DATA_MONGODB_DATABASE=ticket-service
    networks:
      - ms-network

  security-service:
    build:
      context: ../security-service
      dockerfile: Dockerfile
    image: parking-security-service
    container_name: parking-security-service
    depends_on:
      - eureka-server
    ports:
      - "8081:8081"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    networks:
      - ms-network

  api-gateway:
    build:
      context: ../api-gateway
      dockerfile: Dockerfile
    image: parking-api-gateway
    container_name: parking-api-gateway
    depends_on:
      - eureka-server
      - vehicle-service
      - rate-service
      - ticket-service
      - security-service
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    networks:
      - ms-network

  mosquitto:
    image: eclipse-mosquitto
    container_name: mosquitto
    ports:
      - "1883:1883"
    networks:
      - ms-network

networks:
  ms-network:
    driver: bridge
