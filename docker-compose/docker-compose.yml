services:
  eureka-server:
    build:
      context: ../eureka-server
      dockerfile: Dockerfile
    image: parking-eureka-server
    container_name: parking-eureka-server
    ports:
      - "8761:8761"
    networks:
      - ms-network

  vehicle-service:
      build:
        context: ../vehicle-service
        dockerfile: Dockerfile
      image: parking-vehicle-service
      container_name: parking-vehicle-service
      depends_on:
        - eureka-server
      ports:
        - "8082:8082"
      environment:
        # use Eureka inside Docker network
        - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
        # use MongoDB container instead of localhost
        - SPRING_DATA_MONGODB_URI=mongodb://admin:admin123@mongodb:27017
        - SPRING_DATA_MONGODB_DATABASE=vehicle-service
      networks:
        - ms-network

  rate-service:
    build:
      context: ../rate-service
      dockerfile: Dockerfile
    image: parking-rate-service
    container_name: parking-rate-service
    depends_on:
      - eureka-server
    ports:
      - "8083:8083"
    environment:
      # Eureka inside Docker network
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      # Use MySQL container (mysqldb) instead of localhost
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysqldb:3306/ratedb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    networks:
      - ms-network

  ticket-service:
    build:
      context: ../ticket-service
      dockerfile: Dockerfile
    image: parking-ticket-service
    container_name: parking-ticket-service
    depends_on:
      - eureka-server
    ports:
      - "8084:8084"
    environment:
      # Eureka inside Docker network
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      # Use MongoDB container for ticket DB
      - SPRING_DATA_MONGODB_URI=mongodb://admin:admin123@mongodb:27017/ticketdb?authSource=admin
      - SPRING_DATA_MONGODB_DATABASE=ticket-service
    networks:
      - ms-network

networks:
  ms-network:
    driver: bridge
    