spring.application.name=rate-service
server.port=8083

# Eureka Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# MySQL on host port 3307
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${RATE_DB_NAME:ratedb}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Expose health, info and prometheus endpoints
management.endpoints.web.exposure.include=health,info,prometheus

# show detailed health info
management.endpoint.health.show-details=always